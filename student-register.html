<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Student registration for the Hostel J Complaint Management Portal, NIT Jamshedpur."><title>Student Registration | Hostel J</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><main class="auth-card"><a class="brand compact" href="index.html"><span class="brand-mark"><i>HJ</i></span><span><b>Hostel J Portal</b><small>NIT Jamshedpur</small></span></a><h1>Create your Hostel J account</h1><p>Register with your Hostel J details to report and track complaints.</p><form id="register-form" novalidate><label>Full Name<input id="full-name" type="text" required autocomplete="name" maxlength="100"></label><label>Roll Number<input id="roll-number" type="text" required autocomplete="username" maxlength="40"></label><label>Student Email<input id="email" type="email" required autocomplete="email" maxlength="254"></label><label>Password<input id="password" type="password" required autocomplete="new-password" minlength="8"></label><label>Confirm Password<input id="confirm-password" type="password" required autocomplete="new-password" minlength="8"></label><label>Hostel Block<select id="block" required><option value="">Loading hostel blocks…</option></select></label><label>Room Number<input id="room-number" type="text" required maxlength="30" autocomplete="off"></label><p class="form-message" aria-live="polite"></p><button class="button" type="submit">Create Student Account</button></form><div class="auth-links"><a href="student-login.html">Already registered? Student login</a><a href="index.html">Back to home</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-client.js"></script><script src="js/public-auth.js"></script></body></html>
